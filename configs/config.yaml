# Marathi OCR Data Factory configuration

project_root: .

# OCR — pluggable; default Tesseract until bakeoff sets winner
ocr_backend: tesseract
ocr_lang: mar
ocr_use_gpu: false
ocr_cache_dir: data/cache/ocr

render_dpi: 300
hard_crop_dpi: 600

min_width: 400
min_height: 40
max_crop_height: 220
min_aspect_ratio: 2.5

# Active dataset profile (numeral policy is profile-scoped, not factory-global)
active_profile: marathi_hard_validation

profiles:
  marathi_hard_validation:
    allow_ascii_digits: false
    # Soft ranking preference only — NOT a keyword/ref hard gate.
    # Final hard confirmation is LLM vision (exact match + complexity).
    require_marathi_digit_cases: false
    hard_count: 80
    normal_count: 20
    max_samples_per_source: 8
    marathi_digits_only: true
    allow_english_text: false
  general_marathi:
    allow_ascii_digits: true
    require_marathi_digit_cases: false
    hard_count: 80
    normal_count: 20
    max_samples_per_source: 8
    marathi_digits_only: false
    allow_english_text: true

# Scoring: auto | text | visual (scanned PDFs without text layer)
# Heuristic scores are a cheap prefilter; LLM vision is the product end-gate.
scoring_mode: auto
min_complexity_score: 3.0
# Normal lane: ordinary prose — not selected for OCR-hard symbols
normal_max_complexity_score: 2.5
normal_min_words: 6
normal_max_words: 40

min_word_count: 2
max_word_count: 50
target_word_band_min: 20
target_word_band_max: 50
min_char_count: null
max_char_count: null
enforce_char_count: false
target_char_band_min: 20
target_char_band_max: 25

duplicate_threshold: 0.95
text_near_duplicate_threshold: 0.92
perceptual_hash_max_distance: 8

# Discovery — crawl-first; seeds find hard-rich docs (search queries, not classifiers)
discover_mode: crawl_first
llm_discover_rank: true
use_ddg_by_default: true
discover_search_seeds:
  - "महाराष्ट्र शासन निर्णय मराठी filetype:pdf"
  - "शासन परिपत्रक क्रमांक मराठी filetype:pdf"
  - "site:gr.maharashtra.gov.in शासन निर्णय मराठी filetype:pdf"
  - "महाराष्ट्र अधिसूचना मराठी filetype:pdf"
  - "maharashtra government resolution Marathi Devanagari filetype:pdf"
  - "महाराष्ट्र राजपत्र मराठी अंक filetype:pdf"

# Validation export package (inside data/)
validation_export_dir: data/export/marathi_ocr_validation_100
validation_hard_count: 80
validation_normal_count: 20

# Mining loop (--target-count): grow discovery until hard+normal quotas filled
pipeline_max_rounds: 8
pipeline_docs_per_round: 12
pipeline_docs_growth: 12
pipeline_max_docs_cap: 200

# LLM — vision QA: image↔text exactness + complexity (primary hard gate)
llm_enabled: true
llm_api_url: ""
llm_api_key: ""
llm_model: "kimi-k3"
llm_validate_parallel_workers: 2
llm_discover_enabled: true
llm_vision_validate: true
# When LLM runs, hard lane requires is_complex_for_ocr (auto_accept demotes otherwise)
llm_require_complex_for_hard: true

review_required: false
auto_accept: true

workers: 2
batch_size: 16
device: auto
resume: true

paths:
  # All runtime data lives under data/
  sources: data/sources
  raw: data/raw
  rendered: data/rendered
  candidates: data/candidates
  reviewed: data/reviewed
  final: data/final
  export: data/export
  benchmark: data/benchmark
  cache: data/cache

logging:
  level: INFO
  format: "%(asctime)s %(levelname)s [%(name)s] %(message)s"
